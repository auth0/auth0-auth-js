name: Runtime Compatibility (Deno)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  test_core:
    name: auth0-auth-js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build auth0-auth-js
        run: npm run build -w @auth0/auth0-auth-js

      - name: Test
        run: deno run --allow-all ../../node_modules/vitest/vitest.mjs run
        working-directory: packages/auth0-auth-js


  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: test_core
    strategy:
      matrix:
        package: [auth0-server-js, auth0-api-js]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build auth0-auth-js
        run: npm run build -w @auth0/auth0-auth-js

      - name: Build ${{ matrix.package }}
        run: npm run build -w @auth0/${{ matrix.package }}

      - name: Test
        run: deno run --allow-all ../../node_modules/vitest/vitest.mjs run
        working-directory: packages/${{ matrix.package }}